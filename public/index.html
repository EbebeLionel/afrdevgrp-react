<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />

    <!-- Google Search Console ownership verification -->
    <meta name="google-site-verification" content="aUCkV67miIPLLrdSOWkkgHju2Y6sOYxX7DxCZoet3ik" />

    <!-- The exact organisation name leads the title: it is what people search for. -->
    <title>African Development Group Columbia (ADG)</title>
    <meta
      name="description"
      content="African Development Group Columbia (ADG) is a Columbia University student organization. See upcoming events, reels, and meet the executive board."
    />
    <link rel="canonical" href="%REACT_APP_SITE_URL%/" />

    <link rel="icon" href="%PUBLIC_URL%/images/ADG-logo2.JPG" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/images/ADG-logo2.JPG" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Link previews (iMessage, WhatsApp, Instagram, LinkedIn, X) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="African Development Group Columbia" />
    <meta property="og:title" content="African Development Group Columbia (ADG)" />
    <meta
      property="og:description"
      content="Columbia University's African Development Group: events, reels, and community."
    />
    <meta property="og:url" content="%REACT_APP_SITE_URL%/" />
    <meta property="og:image" content="%REACT_APP_SITE_URL%/images/adg-logo.jpeg" />
    <meta name="twitter:card" content="summary" />

    <!-- Tells Google the site's name and who runs it. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "%REACT_APP_SITE_URL%/#website",
            "url": "%REACT_APP_SITE_URL%/",
            "name": "African Development Group Columbia",
            "alternateName": ["ADG Columbia", "ADG", "Columbia African Development Group"],
            "publisher": { "@id": "%REACT_APP_SITE_URL%/#organization" }
          },
          {
            "@type": "Organization",
            "@id": "%REACT_APP_SITE_URL%/#organization",
            "name": "African Development Group Columbia",
            "alternateName": ["ADG Columbia", "ADG", "African Development Group"],
            "url": "%REACT_APP_SITE_URL%/",
            "logo": "%REACT_APP_SITE_URL%/images/adg-logo.jpeg",
            "parentOrganization": {
              "@type": "CollegeOrUniversity",
              "name": "Columbia University",
              "url": "https://www.columbia.edu/"
            }
          }
        ]
      }
    </script>
  </head>
